<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatReader - 微信群聊分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .result-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .result-item h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .result-item p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border-left-color: #f44;
        }
        
        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        
        .user-profile {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
        }
        
        .user-profile h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .profile-stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .profile-stat:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #666;
            font-size: 13px;
        }
        
        .stat-value {
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 ChatReader</h1>
        <p class="subtitle">微信群聊记录分析工具 - 生成摘要与用户画像</p>
        
        <div class="section">
            <label for="groupName">群组名称</label>
            <input type="text" id="groupName" placeholder="请输入群组名称（可选）" value="微信群">
        </div>
        
        <div class="section">
            <label for="format">聊天记录格式</label>
            <select id="format">
                <option value="text">标准文本格式</option>
                <option value="wechat">微信导出格式</option>
                <option value="json">JSON格式</option>
            </select>
        </div>
        
        <div class="section">
            <label for="chatData">聊天记录</label>
            <textarea id="chatData" placeholder="粘贴聊天记录...&#10;&#10;标准文本格式示例：&#10;2023-12-24 10:30:45 张三: 大家好&#10;2023-12-24 10:31:12 李四: 你好啊"></textarea>
        </div>
        
        <button id="analyzeBtn" onclick="analyzChat()">🔍 开始分析</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析中，请稍候...</p>
        </div>
        
        <div class="result" id="result">
            <!-- 结果将在这里显示 -->
        </div>
    </div>
    
    <script>
        async function analyzChat() {
            const groupName = document.getElementById('groupName').value;
            const format = document.getElementById('format').value;
            const chatData = document.getElementById('chatData').value.trim();
            
            if (!chatData) {
                alert('请输入聊天记录');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            loading.classList.add('show');
            result.classList.remove('show');
            
            try {
                // 生成摘要
                const summaryResponse = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: chatData,
                        format: format,
                        group_name: groupName
                    })
                });
                
                const summaryData = await summaryResponse.json();
                
                // 分析用户
                const usersResponse = await fetch('/api/analyze_users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: chatData,
                        format: format
                    })
                });
                
                const usersData = await usersResponse.json();
                
                if (summaryData.success && usersData.success) {
                    displayResults(summaryData.summary, usersData.profiles);
                } else {
                    throw new Error(summaryData.error || usersData.error || '分析失败');
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="result-item error">
                        <h3>❌ 错误</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                result.classList.add('show');
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        function displayResults(summary, profiles) {
            const result = document.getElementById('result');
            
            let html = '<h2>📊 分析结果</h2>';
            
            // 显示摘要
            html += `
                <div class="result-item">
                    <h3>📝 群聊摘要</h3>
                    <p><strong>群组：</strong>${summary.group_name}</p>
                    <p><strong>时间段：</strong>${summary.time_period}</p>
                    <p><strong>消息总数：</strong>${summary.total_messages} 条</p>
                    <p><strong>参与人数：</strong>${summary.participant_count} 人</p>
                    <p><strong>主要话题：</strong></p>
                    <div>
                        ${summary.main_topics.map(topic => `<span class="tag">${topic}</span>`).join('')}
                    </div>
                    <p style="margin-top: 10px;"><strong>摘要：</strong>${summary.summary_text}</p>
                </div>
            `;
            
            // 显示亮点
            if (summary.highlights && summary.highlights.length > 0) {
                html += `
                    <div class="result-item">
                        <h3>💡 聊天亮点</h3>
                        ${summary.highlights.map(h => `<p>• ${h}</p>`).join('')}
                    </div>
                `;
            }
            
            // 显示用户画像
            html += '<div class="result-item"><h3>👥 用户画像</h3>';
            
            const sortedProfiles = Object.values(profiles).sort((a, b) => b.message_count - a.message_count);
            
            for (const profile of sortedProfiles) {
                const activeHours = Object.entries(profile.active_time_distribution)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3)
                    .map(([hour, count]) => `${hour}:00`)
                    .join(', ');
                
                html += `
                    <div class="user-profile">
                        <h4>${profile.user_name}</h4>
                        <div class="profile-stat">
                            <span class="stat-label">消息数量</span>
                            <span class="stat-value">${profile.message_count} 条</span>
                        </div>
                        <div class="profile-stat">
                            <span class="stat-label">活跃时段</span>
                            <span class="stat-value">${activeHours || '未知'}</span>
                        </div>
                        <div class="profile-stat">
                            <span class="stat-label">常见话题</span>
                            <span class="stat-value">${profile.common_topics.slice(0, 3).join(', ') || '无'}</span>
                        </div>
                        <div class="profile-stat">
                            <span class="stat-label">情绪指数</span>
                            <span class="stat-value">${(profile.sentiment_score * 100).toFixed(0)}%</span>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            
            result.innerHTML = html;
            result.classList.add('show');
        }
    </script>
</body>
</html>
